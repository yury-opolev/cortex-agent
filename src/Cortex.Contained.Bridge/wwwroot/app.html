                    <template x-if="form">
                    <div>
                        <div class="form-check form-switch mb-2">
                            <input class="form-check-input" type="checkbox" id="recall-history-enabled" x-model="form.historyEnabled">
                            <label class="form-check-label" for="recall-history-enabled">History search (<code>history_search</code>)</label>
                            <span x-show="isOverridden('historyEnabled')" class="badge bg-info text-dark ms-1">custom</span>
                        </div>
                        <div class="row g-2 mb-2">
                            <div class="col-sm-6">
                                <label class="form-label small mb-1" for="recall-history-mode">Default history search mode
                                    <span x-show="isOverridden('historySearchMode')" class="badge bg-info text-dark ms-1">custom</span></label>
                                <select id="recall-history-mode" class="form-select form-select-sm" x-model="form.historySearchMode">
                                    <option value="hybrid">Hybrid (keyword + semantic when embeddings are available)</option>
                                    <option value="auto">Auto (same as hybrid)</option>
                                    <option value="keyword">Keyword only</option>
                                </select>
                            </div>
                            <div class="col-sm-6 d-flex align-items-end">
                                <div class="form-check form-switch">
                                    <input class="form-check-input" type="checkbox" id="recall-dense" x-model="form.historyDenseEnabled">
                                    <label class="form-check-label" for="recall-dense">Dense embeddings for history</label>
                                    <span x-show="isOverridden('historyDenseEnabled')" class="badge bg-info text-dark ms-1">custom</span>
                                </div>
                            </div>
                        </div>
                        <p class="small text-body-secondary mb-3">
                            Turning dense embeddings on or off rebuilds the history index; until it finishes, searches cover only recent messages.
                        </p>

                        <div class="mb-3" style="max-width: 360px;">
                            <label class="form-label small mb-1" for="recall-memory-mode">Default memory search mode
                                <span x-show="isOverridden('memorySearchMode')" class="badge bg-info text-dark ms-1">custom</span></label>
                            <select id="recall-memory-mode" class="form-select form-select-sm" x-model="form.memorySearchMode">
                                <option value="hybrid">Hybrid (keyword + semantic)</option>
                                <option value="dense">Semantic (dense)</option>
                                <option value="keyword">Keyword only</option>
                            </select>
                        </div>

                        <div class="fw-semibold small mb-1">Reranker budget (this tenant)</div>
                        <div class="row g-2 mb-2">
                            <div class="col-6 col-md">
                                <label class="form-label small mb-0" for="rr-h-topn">History top N</label>
                                <input id="rr-h-topn" type="number" min="1" max="50" class="form-control form-control-sm" x-model.number="form.rerankHistoryTopN">
                            </div>
                            <div class="col-6 col-md">
                                <label class="form-label small mb-0" for="rr-h-chars">History chars</label>
                                <input id="rr-h-chars" type="number" min="200" max="4000" step="100" class="form-control form-control-sm" x-model.number="form.rerankHistoryMaxDocChars">
                            </div>
                            <div class="col-6 col-md">
                                <label class="form-label small mb-0" for="rr-m-topn">Memory top N</label>
                                <input id="rr-m-topn" type="number" min="1" max="50" class="form-control form-control-sm" x-model.number="form.rerankMemoryTopN">
                            </div>
                            <div class="col-6 col-md">
                                <label class="form-label small mb-0" for="rr-m-chars">Memory chars</label>
                                <input id="rr-m-chars" type="number" min="200" max="4000" step="100" class="form-control form-control-sm" x-model.number="form.rerankMemoryMaxDocChars">
                            </div>
                            <div class="col-6 col-md">
                                <label class="form-label small mb-0" for="rr-timeout">Timeout (ms)</label>
                                <input id="rr-timeout" type="number" min="100" max="30000" step="100" class="form-control form-control-sm" x-model.number="form.rerankTimeoutMs">
                            </div>
                        </div>

                        <div x-show="settingsError" class="alert alert-danger py-1 px-2 small" x-text="settingsError"></div>
                        <template x-for="n in notices" :key="n">
                            <div class="alert alert-info py-1 px-2 small mb-1" x-text="n"></div>
                        </template>

                        <div class="d-flex gap-2 mt-2">
                            <button class="btn btn-sm btn-primary" :disabled="!dirty || saving" @click="saveSettings()">
                                <span x-show="saving" class="spinner-border spinner-border-sm me-1"></span>Save
                            </button>
                            <button class="btn btn-sm btn-outline-secondary" :disabled="saving || !(settings?.overridden?.length)"
                                    @click="saveSettings(true)" title="Drop every custom value; the configured defaults apply again">
                                Reset to defaults
                            </button>
                        </div>
                    </div>
                    </template>
                </div>
            </div>

            <!-- ═══ Reranker (Bridge-wide) ═══ -->
            <div class="card mb-3">
                <div class="card-body">
                    <h6 class="text-uppercase text-secondary border-bottom pb-2 mb-3">Reranker (shared by all tenants)</h6>
                    <div class="d-flex align-items-center gap-2 flex-wrap">
                        <div class="form-check form-switch mb-0">
                            <input class="form-check-input" type="checkbox" id="recall-reranker" :checked="reranker?.enabled"
                                   :disabled="rerankerBusy" @change="setReranker($event.target.checked)">
                            <label class="form-check-label" for="recall-reranker">Rerank hybrid results (cortex-reranker sidecar)</label>
                        </div>
                        <span class="badge" :class="sidecarBadge()" x-text="'sidecar: ' + (reranker?.sidecar?.state || 'unknown')"></span>
                    </div>
                    <div x-show="reranker?.sidecar?.problem" class="alert alert-danger py-1 px-2 small mt-2 mb-0" x-text="reranker?.sidecar?.problem"></div>
                </div>
            </div>

            <!-- ═══ Embeddings GPU (Bridge-wide) ═══ -->
            <div class="card mb-3">
                <div class="card-body">
                    <h6 class="text-uppercase text-secondary border-bottom pb-2 mb-3">Embeddings (shared by all tenants)</h6>
                    <div class="d-flex align-items-center gap-2 flex-wrap">
                        <div class="form-check form-switch mb-0">
                            <input class="form-check-input" type="checkbox" id="recall-embeddings-gpu" :checked="embeddingsGpu?.enabled"
                                   :disabled="embeddingsGpuBusy" @change="setEmbeddingsGpu($event.target.checked)">
                            <label class="form-check-label" for="recall-embeddings-gpu">Run embeddings on the GPU (cortex-embeddings sidecar)</label>
                        </div>
                        <span class="badge" :class="embeddingsGpuBadge()" x-text="'sidecar: ' + (embeddingsGpu?.sidecar?.state || 'unknown')"></span>
                        <span class="small text-secondary" x-text="'running as: ' + embeddingsPlacement()"></span>
                    </div>
                    <div class="small text-secondary mt-1">Needs an NVIDIA GPU with Docker GPU support. Off keeps the CPU. Switching recreates the sidecar; if the GPU cannot be used it falls back to the CPU and says so here. While built-in memory is off the sidecar is stopped and the switch applies once memory is on.</div>
                    <div x-show="embeddingsGpu?.sidecar?.problem" class="alert py-1 px-2 small mt-2 mb-0"
                         :class="embeddingsGpu?.sidecar?.state === 'running' ? 'alert-warning' : 'alert-danger'" x-text="embeddingsGpu?.sidecar?.problem"></div>
                </div>
            </div>

            <!-- ═══ Status ═══ -->
            <div class="card mb-3" x-show="status">
                <div class="card-body small">
                    <h6 class="text-uppercase text-secondary border-bottom pb-2 mb-3">Status <span class="fw-normal text-lowercase">(refreshes every 5 s)</span></h6>
                    <template x-if="status">
                    <div>
                        <div class="fw-semibold">History index</div>
                        <div class="mb-2">
                            <span class="badge" :class="status.history.enabled ? 'bg-success' : 'bg-secondary'" x-text="status.history.enabled ? 'on' : 'off'"></span>
                            <span class="badge bg-secondary" x-text="'storage: ' + status.history.storage"></span>
                            <span class="badge" :class="status.history.buildComplete ? 'bg-success' : 'bg-warning text-dark'"
                                  x-text="status.history.buildComplete ? 'build complete' : (status.history.buildInProgress ? 'building…' : 'not built')"></span>
                            <span x-show="status.history.halted" class="badge bg-danger">halted</span>
                            <span class="ms-1" x-text="'generation ' + (status.history.generation ?? '—') + ' · checkpoint lag ' + status.history.checkpointLag + ' · journal backlog ' + status.history.journalBacklog"></span>
                        </div>
                        <div x-show="status.history.lastError" class="text-danger mb-2" x-text="'Last error: ' + status.history.lastError"></div>
                        <div x-show="status.history.pendingErasureTasks > 0" class="text-warning mb-2"
                             x-text="'Erasure still running: ' + status.history.pendingErasureSteps.join(', ')"></div>

                        <div class="fw-semibold">Dense embeddings</div>
                        <div class="mb-2">
                            <span class="badge" :class="status.dense.state === 'on' ? 'bg-success' : (status.dense.state === 'off' ? 'bg-secondary' : 'bg-danger')" x-text="status.dense.state"></span>
                            <span class="ms-1" x-text="status.dense.embedded + ' / ' + status.dense.total + ' chunks embedded · ' + status.dense.pending + ' pending · ' + status.dense.failed + ' failed'"></span>
                            <div class="progress mt-1" style="height: 6px;" x-show="status.dense.total > 0">
                                <div class="progress-bar" :style="'width:' + percent(status.dense.embedded, status.dense.total) + '%'"></div>
                            </div>
                            <div x-show="status.dense.oldestPendingQueuedAt" class="text-body-secondary" x-text="'Oldest pending since ' + formatDateTime(status.dense.oldestPendingQueuedAt)"></div>
                            <div x-show="status.dense.lastError" class="text-danger" x-text="'Last error: ' + status.dense.lastError"></div>
                        </div>

                        <div class="fw-semibold">Reranker (this agent)</div>
                        <div class="mb-2">
                            <span class="badge" :class="status.reranker.state === 'ok' ? 'bg-success' : (status.reranker.state === 'off' ? 'bg-secondary' : 'bg-danger')" x-text="status.reranker.state"></span>
                            <span class="ms-1" x-show="status.reranker.lastLatencyMs != null" x-text="'last call ' + Math.round(status.reranker.lastLatencyMs) + ' ms at ' + formatDateTime(status.reranker.lastCallAt)"></span>
                            <span class="ms-1" x-show="status.reranker.consecutiveFailures > 0" x-text="status.reranker.consecutiveFailures + ' consecutive failures'"></span>
                            <div x-show="status.reranker.lastError" class="text-danger" x-text="'Last error: ' + status.reranker.lastError"></div>
                        </div>

                        <div class="fw-semibold">Event backfill</div>
                        <div class="d-flex align-items-center gap-2 mb-2">
                            <span x-text="status.eventBackfill.lastRunAt
                                ? 'Last run ' + formatDateTime(status.eventBackfill.lastRunAt) + ': ' + status.eventBackfill.lastInserted + ' of ' + status.eventBackfill.lastScanned + ' messages backfilled'
                                : 'Not run since the agent started'"></span>
                            <button class="btn btn-sm btn-outline-secondary" :disabled="backfillRunning" @click="runBackfill()">
                                <span x-show="backfillRunning" class="spinner-border spinner-border-sm me-1"></span>Run event backfill
                            </button>
                        </div>

                        <div>
                            <span class="fw-semibold">Needs review:</span>
                            <span x-text="status.quarantinedMemories + ' memories'"></span>
                            <a href="#recall-review" class="ms-1" x-show="status.quarantinedMemories > 0">review below</a>
                        </div>
                    </div>
                    </template>
                </div>
            </div>

            <!-- ═══ Delete history ═══ -->
            <div class="card mb-3">
                <div class="card-body">
                    <h6 class="text-uppercase text-secondary border-bottom pb-2 mb-3">Delete history</h6>
                    <div class="row g-2 mb-2">
                        <div class="col-sm-6">
                            <label class="form-label small mb-1" for="purge-channel">Channel</label>
                            <select id="purge-channel" class="form-select form-select-sm" x-model="purge.channelId" @change="refreshPreview()">
                                <option value="">All channels</option>
                                <template x-for="ch in channels" :key="ch.id">
                                    <option :value="ch.id" x-text="prettyName(ch.id) + ' (' + ch.messageCount + ')'"></option>
                                </template>
                            </select>
                        </div>
                        <div class="col-sm-6">
                            <label class="form-label small mb-1" for="purge-time">Time</label>
                            <select id="purge-time" class="form-select form-select-sm" x-model="purge.time" @change="refreshPreview()">
                                <option value="all">Everything</option>
                                <option value="older">Older than…</option>
                                <option value="between">Between…</option>
                            </select>
                        </div>
                    </div>
                    <div class="row g-2 mb-2" x-show="purge.time !== 'all'">
                        <div class="col-sm-6" x-show="purge.time === 'between'">
                            <label class="form-label small mb-1" for="purge-from">From</label>
                            <input id="purge-from" type="datetime-local" class="form-control form-control-sm" x-model="purge.from" @change="refreshPreview()">
                        </div>
                        <div class="col-sm-6">
                            <label class="form-label small mb-1" for="purge-until" x-text="purge.time === 'between' ? 'Until' : 'Older than'"></label>
                            <input id="purge-until" type="datetime-local" class="form-control form-control-sm" x-model="purge.olderThan" @change="refreshPreview()">
                        </div>
                    </div>
                    <div class="mb-2">
                        <div class="small fw-semibold mb-1">Memories created in that period</div>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" id="dep-review" value="review" x-model="purge.dependentMemories">
                            <label class="form-check-label small" for="dep-review">Review them (hidden from the agent until I keep or delete them)</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" id="dep-delete" value="delete" x-model="purge.dependentMemories">
                            <label class="form-check-label small" for="dep-delete">Delete them with the history (permanent)</label>
                        </div>
                    </div>
                    <div class="small mb-2">
                        <span x-show="previewing" class="spinner-border spinner-border-sm me-1"></span>
                        <span x-show="previewError" class="text-danger" x-text="previewError"></span>
                        <span x-show="preview && !previewError" x-text="confirmation"></span>
                        <div x-show="previewRange" class="text-body-secondary" x-text="previewRange"></div>
                    </div>
                    <button class="btn btn-sm btn-outline-danger" :disabled="!preview || preview.messages === 0 || previewing" @click="showPurgeModal = true">
                        <i class="bi bi-trash me-1"></i>Delete…
                    </button>
                </div>
            </div>

            <!-- Purge confirmation modal -->
            <div x-show.important="showPurgeModal" class="modal d-block" tabindex="-1" style="background: rgba(0,0,0,0.5);">
                <div class="modal-dialog">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h5 class="modal-title">Delete history</h5>
                            <button type="button" class="btn-close" @click="showPurgeModal = false"></button>
                        </div>
                        <div class="modal-body">
                            <p x-text="confirmation"></p>
                            <p class="small text-body-secondary mb-0" x-text="previewRange"></p>
                        </div>
                        <div class="modal-footer">
                            <button class="btn btn-outline-secondary btn-sm" @click="showPurgeModal = false">Cancel</button>
                            <button class="btn btn-danger btn-sm" @click="confirmPurge()" :disabled="purging">
                                <span x-show="!purging" x-text="purge.dependentMemories === 'delete' ? 'Delete history and memories' : 'Delete history'"></span>
                                <span x-show="purging"><span class="spinner-border spinner-border-sm"></span> Deleting...</span>
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- ═══ Needs review ═══ -->
            <div class="card mb-3 border-warning" id="recall-review">
                <div class="card-body">
                    <h6 class="text-uppercase text-secondary border-bottom pb-2 mb-2">
                        Needs review (<span x-text="quarantineTotal"></span>)
                    </h6>
                    <p class="small text-body-secondary">
                        Memories created while history you deleted was recent. They are hidden from the agent until you keep or delete them.
                    </p>
                    <div x-show="quarantineTotal === 0" class="text-body-secondary small">Nothing to review.</div>
                    <div x-show="quarantine.length > 0" class="d-flex align-items-center gap-2 mb-2 flex-wrap">
                        <div class="form-check mb-0">
                            <input class="form-check-input" type="checkbox" id="review-all" :checked="allSelected" @change="toggleAll($event.target.checked)">
                            <label class="form-check-label small" for="review-all">Select all</label>
                        </div>
                        <a href="#" class="small" x-show="hasMoreQuarantine" @click.prevent="selectEverything()"
                           x-text="'Select all ' + quarantineTotal"></a>
                        <button class="btn btn-sm btn-outline-success" :disabled="selectedIds.length === 0 || reviewBusy" @click="decide(selectedIds, true)">
                            <i class="bi bi-check-lg"></i> Keep selected (<span x-text="selectedIds.length"></span>)
                        </button>
                        <button class="btn btn-sm btn-outline-danger" :disabled="selectedIds.length === 0 || reviewBusy" @click="showBulkDeleteModal = true">
                            <i class="bi bi-trash"></i> Delete selected (<span x-text="selectedIds.length"></span>)
                        </button>
                        <span class="small text-body-secondary" x-show="reviewProgress" x-text="reviewProgress"></span>
                    </div>
                    <template x-for="q in quarantine" :key="'rq-' + q.memory.memoryId">
                        <div class="d-flex gap-2 align-items-start border-top pt-2 mt-2">
                            <input class="form-check-input mt-1" type="checkbox" :id="'rq-' + q.memory.memoryId" x-model="selected[q.memory.memoryId]">
                            <div class="flex-grow-1">
                                <div x-show="q.memory.title" class="fw-semibold" x-text="q.memory.title"></div>
                                <div style="white-space: pre-wrap; font-size:var(--text-base);"
                                     x-text="expanded[q.memory.memoryId] ? q.memory.content : preview300(q.memory.content)"></div>
                                <a href="#" class="small" x-show="q.memory.content && q.memory.content.length > 300"
                                   @click.prevent="expanded[q.memory.memoryId] = !expanded[q.memory.memoryId]"
                                   x-text="expanded[q.memory.memoryId] ? 'Show less' : 'Show all'"></a>
                                <div class="small text-body-secondary">
                                    <span x-text="'Created ' + formatDateTime(q.memory.createdAt)"></span> ·
                                    <span x-text="purgeSource(q)"></span>
                                </div>
                            </div>
                            <div class="d-flex gap-1 flex-shrink-0">
                                <button class="btn btn-sm btn-outline-success" :disabled="reviewBusy" @click="decide([q.memory.memoryId], true)" title="Keep">
                                    <i class="bi bi-check-lg"></i>
                                </button>
                                <button class="btn btn-sm btn-outline-danger" :disabled="reviewBusy" @click="askDelete(q.memory.memoryId)" title="Delete">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </div>
                        </div>
                    </template>
                    <div class="mt-2" x-show="hasMoreQuarantine">
                        <button class="btn btn-sm btn-outline-secondary" :disabled="reviewBusy" @click="loadQuarantine(true)">
                            Load more (<span x-text="quarantine.length"></span> of <span x-text="quarantineTotal"></span> shown)
                        </button>
                    </div>
                </div>
            </div>

            <!-- Bulk delete confirmation -->
            <div x-show.important="showBulkDeleteModal" class="modal d-block" tabindex="-1" style="background: rgba(0,0,0,0.5);">
                <div class="modal-dialog modal-sm">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h5 class="modal-title">Delete memories</h5>
                            <button type="button" class="btn-close" @click="showBulkDeleteModal = false"></button>
                        </div>
                        <div class="modal-body" x-text="'Delete ' + selectedIds.length + ' memories permanently?'"></div>
                        <div class="modal-footer">
                            <button class="btn btn-secondary btn-sm" @click="showBulkDeleteModal = false">Cancel</button>
                            <button class="btn btn-danger btn-sm" :disabled="reviewBusy" @click="decide(selectedIds, false)">Delete</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        </template>

        <!-- ── Tenant Storage (encryption at rest, recovery kit) ── -->
        <template x-if="$store.router.page === 'tenant-storage'">
        <div x-data="tenantStoragePage()" class="container pb-3" style="max-width: 860px;">
            <!-- Sub-nav is rendered above by the shared tenantTabs() block. -->

            <div x-show="!connected" class="alert alert-warning py-2">
                <i class="bi bi-plug me-1"></i>The agent is not connected; its storage status is unavailable.
            </div>
            <div x-show="needsRestore" class="alert alert-danger py-2">
                <i class="bi bi-shield-exclamation me-1"></i>The agent's data is encrypted with a key the Bridge does not hold. Restore the recovery kit below.
            </div>
            <div x-show="restarting" class="alert alert-info py-2">
                <span class="spinner-border spinner-border-sm me-1"></span>The agent is restarting and encrypting its stores…
            </div>

            <!-- ═══ Encryption at rest ═══ -->
            <div class="card mb-3">
                <div class="card-body">
                    <h6 class="text-uppercase text-secondary border-bottom pb-2 mb-3">Encryption at rest</h6>
                    <template x-if="status">
                    <div>
                        <p class="mb-2">
                            <span class="badge" :class="encrypted ? 'bg-success' : 'bg-warning text-dark'" x-text="encrypted ? 'On' : (status.restartPending ? 'Pending restart' : 'Off')"></span>
                            <span class="small text-body-secondary ms-1" x-show="encrypted" x-text="'since ' + formatDateTime(status.enabledAt) + ' (' + status.source + ')'"></span>
                        </p>
                        <div class="small mb-2">
                            Key: <span class="badge" :class="badge(status.keyState)" x-text="status.keyState"></span>
                            fingerprint <code x-text="fingerprint(status.keyFingerprint)"></code>
                            · messages <span class="badge" :class="badge(status.messagesState)" x-text="status.messagesState"></span>
                            · memory <span class="badge" :class="badge(status.memoryState)" x-text="status.memoryState"></span>
                        </div>
                        <table class="table table-sm small mb-2">
                            <thead><tr><th>Store</th><th>Path</th><th>State</th><th class="text-end">Size</th></tr></thead>
                            <tbody>
                                <template x-for="item in status.items" :key="item.id">
                                    <tr :title="item.detail || ''">
                                        <td x-text="item.label"></td>
                                        <td><code x-text="item.path"></code></td>
                                        <td><span class="badge" :class="badge(item.state)" x-text="item.state"></span></td>
                                        <td class="text-end" x-text="bytes(item.bytes) + (item.files != null ? ' · ' + item.files + ' files' : '')"></td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </div>
                    </template>
                    <div class="fw-semibold small mb-1">On this Windows host (Bridge)</div>
                    <ul class="small mb-3">
                        <template x-for="store in bridgeStores" :key="store.id">
                            <li><span x-text="store.label"></span> <span class="badge" :class="badge(store.state)" x-text="store.state"></span>
                                <span class="text-body-secondary" x-text="' — ' + store.detail"></span></li>
                        </template>
                    </ul>
                    <button class="btn btn-sm btn-outline-danger" x-show="status && !encrypted && !status.restartPending" :disabled="previewing" @click="openEnable()">
                        <i class="bi bi-shield-lock me-1"></i>Turn on encryption…
                    </button>
                </div>
            </div>

            <!-- ═══ Recovery kit ═══ -->
            <div class="card mb-3">
                <div class="card-body">
                    <h6 class="text-uppercase text-secondary border-bottom pb-2 mb-3">Recovery kit</h6>
                    <p class="small text-body-secondary">
                        The storage key lives in this Windows profile (DPAPI). If the profile is reset or lost, the encrypted history and
                        memories can only be opened with the recovery kit: the key encrypted with a passphrase you choose.
                        Bridge key fingerprint <code x-text="fingerprint(bridge?.keyFingerprint)"></code>;
                        last exported <span x-text="formatDateTime(bridge?.recoveryKitExportedAt)"></span>.
                    </p>
                    <div class="row g-2 mb-2">
                        <div class="col-md-4"><input type="password" class="form-control form-control-sm" placeholder="Bridge password" x-model="kit.password" autocomplete="current-password"></div>
                        <div class="col-md-4"><input type="password" class="form-control form-control-sm" placeholder="Kit passphrase (12+ chars)" x-model="kit.passphrase" autocomplete="new-password"></div>
                        <div class="col-md-4"><input type="password" class="form-control form-control-sm" placeholder="Repeat passphrase" x-model="kit.passphrase2" autocomplete="new-password"></div>
                    </div>
                    <div class="small text-danger mb-2" x-show="kit.passphrase && kitError" x-text="kitError"></div>
                    <button class="btn btn-sm btn-primary" :disabled="!!kitError || exporting" @click="exportKit()">
                        <span x-show="exporting" class="spinner-border spinner-border-sm me-1"></span><i class="bi bi-download me-1"></i>Download recovery kit
                    </button>

                    <details class="mt-3" :open="needsRestore">
                        <summary class="small">Restore a recovery kit</summary>
                        <p class="small text-body-secondary mt-2">
                            Only when the Bridge lost the key (new Windows profile, restored backup). A working key is never replaced.
                        </p>
                        <div class="row g-2 mb-2">
                            <div class="col-md-4"><input type="file" accept=".json,application/json" class="form-control form-control-sm" @change="onKitFile($event)"></div>
                            <div class="col-md-4"><input type="password" class="form-control form-control-sm" placeholder="Kit passphrase" x-model="restore.passphrase"></div>
                            <div class="col-md-4"><input type="password" class="form-control form-control-sm" placeholder="Bridge password" x-model="restore.password" autocomplete="current-password"></div>
                        </div>
                        <div class="form-check mb-2">
                            <input class="form-check-input" type="checkbox" id="restoreReplace" x-model="restore.replaceExisting">
                            <label class="form-check-label small" for="restoreReplace">Replace the key this Bridge holds even though the agent does not report a problem with it (only if you are sure the kit is the right one)</label>
                        </div>
                        <button class="btn btn-sm btn-outline-primary" :disabled="!restore.text || !restore.passphrase || !restore.password || restoring" @click="restoreKit()">
                            <span x-show="restoring" class="spinner-border spinner-border-sm me-1"></span>Restore key
                        </button>
                    </details>
                </div>
            </div>

            <!-- ═══ Evaluation (Gate H, κ, sanitised copy): one button, three owner inputs ═══ -->
            <div class="card mb-3" x-data="evalRunPanel()" @keydown.window="onKey($event)">
                <div class="card-body">
                    <h6 class="text-uppercase text-secondary border-bottom pb-2 mb-3">Evaluation</h6>
                    <div x-show="error" class="alert alert-warning py-2 small" x-text="error"></div>

                    <!-- Start -->
                    <template x-if="run && !active">
                    <div class="mb-3">
                        <p class="small text-secondary mb-2">
                            Runs the whole quality evaluation of history and memory search: writes and judges the test queries
                            (<span x-text="run.queryModel"></span> writes, <span x-text="run.judgeModel"></span> judges), asks you to grade a
                            small sample, pre-registers, runs the held-out comparison on raw data and on the sanitised copy, and exports the
                            encrypted package. It runs for several hours; you can close this page.
                        </p>
                        <div class="d-flex flex-wrap gap-2 align-items-center">
                            <input type="password" class="form-control form-control-sm" style="max-width: 220px;" placeholder="Bridge password" autocomplete="current-password" x-model="start.password">
                            <div class="form-check mb-0">
                                <input class="form-check-input" type="checkbox" id="eval-fresh" x-model="start.fresh">
                                <label class="form-check-label small" for="eval-fresh">Start fresh (deletes the previous evaluation's datasets)</label>
                            </div>
                            <button class="btn btn-primary btn-sm" :disabled="busy || !start.password" @click="startRun()">
                                <i class="bi bi-play-fill me-1"></i>Run evaluation
                            </button>
                        </div>
                    </div>
                    </template>

                    <!-- Status and phases -->
                    <template x-if="run && run.exists">
                    <div>
                        <div class="d-flex align-items-center gap-2 mb-2">
                            <span class="badge" :class="{ 'bg-primary': run.status === 'running', 'bg-warning text-dark': run.status === 'waiting', 'bg-danger': run.status === 'stopped', 'bg-secondary': run.status === 'cancelled', 'bg-success': run.status === 'completed' }" x-text="run.status"></span>
                            <span class="small" x-text="phaseLabel(run.phase)"></span>
                            <span class="small text-secondary" x-show="run.currentJob" x-text="'· ' + run.currentJob"></span>
                            <button class="btn btn-outline-danger btn-sm ms-auto" x-show="active || run.status === 'stopped'" :disabled="busy" @click="cancelRun()">Cancel</button>
                        </div>
                        <div x-show="run.status === 'stopped' || run.status === 'cancelled'" class="alert alert-danger py-2 small">
                            <div x-text="run.message || 'The run was cancelled.'"></div>
                            <div class="d-flex gap-2 mt-2">
                                <input type="password" class="form-control form-control-sm" style="max-width: 220px;" placeholder="Bridge password" x-model="resume.password">
                                <button class="btn btn-sm btn-light" :disabled="busy || !resume.password" @click="resumeRun()">Resume</button>
                            </div>
                        </div>
                        <ol class="list-unstyled small mb-3 row row-cols-2 g-0">
                            <template x-for="p in run.phases" :key="p.name">
                                <li class="col"><i class="bi me-1" :class="phaseIcon(p.state)"></i><span x-text="phaseLabel(p.name)"></span></li>
                            </template>
                        </ol>

                        <!-- Wait: κ grading -->
                        <div x-show="run.waiting === 'grading'" class="border rounded p-2 mb-3">
                            <div class="fw-semibold mb-1">Grade the evaluation sample
                                <span class="text-secondary fw-normal" x-text="'(' + (run.grading?.graded ?? 0) + ' of ' + (run.grading?.total ?? 0) + ' graded)'"></span></div>
                            <p class="small text-secondary mb-2">For each query and found message or memory: <b>2</b> answers it, <b>1</b> partly or as needed context, <b>0</b> not relevant. The judge's grade is hidden. Keys: 0 1 2, → skip, ← back, Esc close. You can change grades until you press <b>Done</b>; then κ is computed and the grades are locked.</p>
                            <template x-if="!grading.item">
                                <div class="d-flex gap-2">
                                    <input type="password" class="form-control form-control-sm" style="max-width: 220px;" placeholder="Bridge password" x-model="grading.password">
                                    <button class="btn btn-sm btn-primary" :disabled="grading.busy || !grading.password" @click="openGrading()" x-text="gradingLocked ? 'Review grades' : 'Start grading'"></button>
                                </div>
                            </template>
                            <template x-if="grading.item">
                                <div>
                                    <div class="small text-secondary mb-1" x-text="'Item ' + ((grading.item?.index ?? 0) + 1) + ' of ' + grading.item?.total + ' · ' + (grading.item?.tool === 'memory-eval' ? 'memory' : 'history')"></div>
                                    <div class="mb-2"><span class="text-secondary small">Query</span><div class="fw-semibold" x-text="grading.item?.query"></div></div>
                                    <div class="mb-2"><span class="text-secondary small">Found</span><div class="border rounded p-2 small" style="white-space: pre-wrap; max-height: 260px; overflow: auto;" x-text="grading.item?.candidate"></div></div>
                                    <div class="d-flex gap-2 align-items-center">
                                        <template x-for="g in [0, 1, 2]" :key="g">
                                            <button class="btn btn-sm" :class="grading.item?.humanGrade === g ? 'btn-primary' : 'btn-outline-primary'" :disabled="grading.busy || gradingLocked" @click="grade(g)" x-text="g"></button>
                                        </template>
                                        <button class="btn btn-sm btn-outline-secondary" :disabled="grading.busy || grading.item?.index === 0" @click="showItem(grading.item.index - 1)">Back</button>
                                        <button class="btn btn-sm btn-outline-secondary" :disabled="grading.busy" @click="showItem((grading.item.index + 1) % grading.item.total)">Skip</button>
                                        <button class="btn btn-sm btn-link ms-auto" @click="closeGrading()">Close</button>
                                    </div>
                                </div>
                            </template>
                            <div x-show="run.grading?.complete && !gradingLocked" class="d-flex gap-2 align-items-center mt-2">
                                <button class="btn btn-sm btn-success" :disabled="grading.busy || !grading.grant" @click="submitGrading()">Done: submit grades</button>
                                <span class="small text-secondary" x-text="grading.grant ? 'Every item is graded. Submitting locks the grades and computes κ.' : 'Every item is graded: enter the password above, then submit.'"></span>
                            </div>
                            <div x-show="gradingLocked" class="alert alert-warning py-1 small mt-2 mb-0">
                                <div>Grades submitted and locked. κ = <b x-text="number(run.grading?.kappa)"></b>
                                    (history <span x-text="number(run.grading?.historyKappa)"></span>, memory <span x-text="number(run.grading?.memoryKappa)"></span>).</div>
                                <div x-show="run.message" x-text="run.message"></div>
                            </div>
                            <div x-show="grading.error" class="text-danger small mt-1" x-text="grading.error"></div>
                        </div>

                        <!-- Wait: dictionary -->
                        <div x-show="run.waiting === 'dictionary'" class="border rounded p-2 mb-3">
                            <div class="fw-semibold mb-1">Approve dictionary terms</div>
                            <p class="small text-secondary mb-2">Accept the names, places, organisations and handles the sanitised copy must replace; add spellings that are missing.</p>
                            <div x-show="run.leaks.length > 0" class="alert alert-warning py-1 small">
                                The last freeze was refused (<span x-text="run.freezeRounds"></span>): personal values remained.
                                <template x-for="leak in run.leaks" :key="leak"><div x-text="leak"></div></template>
                            </div>
                            <div class="d-flex gap-2 mb-2">
                                <input type="password" class="form-control form-control-sm" style="max-width: 220px;" placeholder="Bridge password" x-model="dict.password">
                                <button class="btn btn-sm btn-outline-primary" x-show="!dict.loaded" :disabled="dict.busy || !dict.password" @click="loadSuggestions()">Show suggestions</button>
                            </div>
                            <template x-if="dict.loaded">
                                <div>
                                    <div style="max-height: 300px; overflow: auto;">
                                        <table class="table table-sm small mb-2">
                                            <thead><tr><th></th><th>Term</th><th>Kind</th><th>Same person as</th><th>Seen</th></tr></thead>
                                            <tbody>
                                                <template x-for="s in dict.suggestions" :key="s.term + s.source">
                                                    <tr>
                                                        <td><input type="checkbox" class="form-check-input" x-model="s.accept"></td>
                                                        <td x-text="s.term"></td>
                                                        <td><select class="form-select form-select-sm" x-model="s.kind"><template x-for="k in kinds" :key="k"><option :value="k" x-text="k"></option></template></select></td>
                                                        <td><input class="form-control form-control-sm" x-model="s.entity" placeholder="optional"></td>
                                                        <td x-text="s.count"></td>
                                                    </tr>
                                                </template>
                                            </tbody>
                                        </table>
                                    </div>
                                    <div class="d-flex gap-2 mb-2">
                                        <input class="form-control form-control-sm" placeholder="Add a term" x-model="dict.draft.term" @keydown.enter.prevent="addTerm()">
                                        <select class="form-select form-select-sm" style="max-width: 140px;" x-model="dict.draft.kind"><template x-for="k in kinds" :key="k"><option :value="k" x-text="k"></option></template></select>
                                        <input class="form-control form-control-sm" placeholder="same person as (optional)" x-model="dict.draft.entity">
                                        <button class="btn btn-sm btn-outline-secondary" @click="addTerm()">Add</button>
                                    </div>
                                    <div class="small text-secondary mb-2" x-show="dict.extra.length > 0" x-text="'Added: ' + dict.extra.map(e => e.term).join(', ')"></div>
                                    <button class="btn btn-sm btn-primary" :disabled="busy || !dict.password" @click="approveDictionary()" x-text="'Approve ' + acceptedTerms.length + ' terms and freeze'"></button>
                                </div>
                            </template>
                        </div>

                        <!-- Wait: passphrase -->
                        <div x-show="run.waiting === 'passphrase'" class="border rounded p-2 mb-3">
                            <div class="fw-semibold mb-1">Package passphrase</div>
                            <p class="small text-secondary mb-2">The frozen copy <span x-text="run.version"></span> is exported encrypted with this passphrase (at least 12 characters, not the recovery kit's). Keep it with your offline secrets; it is not stored.</p>
                            <div class="d-flex flex-wrap gap-2">
                                <input type="password" class="form-control form-control-sm" style="max-width: 200px;" placeholder="Bridge password" x-model="exp.password">
                                <input type="password" class="form-control form-control-sm" style="max-width: 200px;" placeholder="Package passphrase" autocomplete="new-password" x-model="exp.passphrase">
                                <input type="password" class="form-control form-control-sm" style="max-width: 200px;" placeholder="Repeat passphrase" autocomplete="new-password" x-model="exp.confirm">
                                <button class="btn btn-sm btn-primary" :disabled="busy || !exp.password || !!passphraseProblem" @click="exportPackage()">Export</button>
                            </div>
                            <div class="small text-secondary mt-1" x-show="exp.passphrase && passphraseProblem" x-text="passphraseProblem"></div>
                        </div>

                        <!-- Results -->
                        <template x-if="summary">
                        <div class="border rounded p-2 mb-3">
                            <div class="fw-semibold mb-2">Results <span class="text-secondary fw-normal small" x-text="'(frozen ' + (summary.version || '—') + ', κ ' + number(summary.kappa?.all) + ' on ' + summary.kappa?.items + ' items)'"></span></div>
                            <table class="table table-sm small mb-2">
                                <thead><tr><th></th><th>Chosen</th><th>Δ nDCG@10 raw [95% CI]</th><th>Gate H (non-inferior)</th><th>Δ sanitised</th><th>raw − sanitised</th><th>Gate R</th></tr></thead>
                                <tbody>
                                    <template x-for="tool in ['history', 'memory']" :key="tool">

                                            <td x-text="tool"></td>
                                            <td x-text="summary[tool]?.raw?.config || '—'"></td>
                                            <td x-text="delta(summary[tool]?.raw)"></td>

                                            <td x-text="difference(summary[tool]?.raw, summary[tool]?.sanitised)"></td>
                                            <td x-text="summary[tool]?.gateR ? (summary[tool].gateR.passed ? 'pass' : 'fail') : 'not run'"></td>
                                        </tr>
                                    </template>
                                </tbody>
                            </table>

                        </template>

                            <span class="text-secondary">Reports:</span>
                            <template x-for="key in run.reports" :key="key">
                                <a href="#" class="me-2" @click.prevent="openReport(key)" x-text="key"></a>
                            </template>
                        </div>
                        <template x-if="report.key">
                            <div class="mt-2">
                                <div class="d-flex"><span class="small fw-semibold" x-text="report.key"></span><button class="btn-close ms-auto" @click="report = { key: '', text: '' }"></button></div>

                            </div>
                        </template>
                        <details class="small mt-2" x-show="run.log.length > 0">
                            <summary class="text-secondary">Steps</summary>
                            <template x-for="(entry, i) in run.log" :key="i">
                                <div><span class="text-secondary" x-text="formatDateTime(entry.at)"></span> <span x-text="entry.step"></span> <span class="text-secondary" x-text="entry.exitCode === null ? '' : '(exit ' + entry.exitCode + ')'"></span> <span x-text="entry.note"></span></div>
                            </template>
                        </details>
                    </div>
                    </template>
                </div>
            </div>

            <!-- ═══ Evaluation corpora (sanitised frozen copies, D6) ═══ -->
            <div class="card mb-3" x-show="frozen && (frozen.versions.length > 0 || frozen.pendingOffsiteDeletions.length > 0)">
                <div class="card-body">
                    <h6 class="text-uppercase text-secondary border-bottom pb-2 mb-3">Evaluation corpora</h6>
                    <p class="small text-body-secondary">
                        Sanitised, frozen copies of history and memories for the quality gates (pseudonymised; the local copy is encrypted with the storage key).
                        The package is encrypted with its own passphrase and is the only form that leaves this machine: attach it to the SafeExchange
                        secret <code>cortex-recovery-kit</code> under its file name (see docs/evaluation-runbook.md).
                    </p>
                    <table class="table table-sm small mb-2">
                        <thead><tr><th>Version</th><th>Range</th><th>Messages</th><th>Queries</th><th>Exported</th><th>Uploaded</th><th></th></tr></thead>
                        <tbody>
                            <template x-for="v in frozen?.versions || []" :key="v.version">
                                <tr>
                                    <td x-text="v.version + (v.imported ? ' (imported)' : '')"></td>
                                    <td x-text="new Date(v.corpusFrom).toLocaleDateString() + ' – ' + new Date(v.corpusTo).toLocaleDateString()"></td>
                                    <td x-text="v.messages + ' · ' + v.memories + ' memories'"></td>
                                    <td x-text="v.historyQueries + ' / ' + v.memoryQueries"></td>
                                    <td x-text="formatDateTime(v.exportedAt)"></td>
                                    <td x-text="v.uploaded ? 'yes' : 'no'"></td>
                                    <td class="text-end">
                                        <button class="btn btn-sm btn-outline-primary" x-show="hasPackage(v)" :disabled="!frozenPassword || downloading === v.packageFileName" @click="downloadPackage(v.packageFileName)">
                                            <span x-show="downloading === v.packageFileName" class="spinner-border spinner-border-sm me-1"></span><i class="bi bi-download"></i>
                                        </button>
                                    </td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                    <input type="password" class="form-control form-control-sm mb-2" style="max-width: 260px;" placeholder="Bridge password to download" x-model="frozenPassword" autocomplete="current-password">
                    <div class="small text-danger" x-show="(frozen?.pendingOffsiteDeletions || []).length > 0">
                        <i class="bi bi-cloud-slash me-1"></i>Off-machine copies to delete are listed on the Recall page.
                    </div>
                </div>
            </div>

            <!-- Enable confirmation modal -->
            <div x-show.important="showEnableModal" class="modal d-block" tabindex="-1" style="background: rgba(0,0,0,0.5);">
                <div class="modal-dialog modal-lg">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h5 class="modal-title">Turn on encryption at rest</h5>
                            <button type="button" class="btn-close" @click="showEnableModal = false"></button>
                        </div>
                        <div class="modal-body small">
                            <div class="alert alert-danger py-1 px-2" x-show="previewError" x-text="previewError"></div>
                            <div x-show="preview">
                            <template x-for="w in preview?.warnings || []" :key="w"><div class="alert alert-warning py-1 px-2 mb-1" x-text="w"></div></template>
                            <template x-for="b in preview?.blockers || []" :key="b"><div class="alert alert-danger py-1 px-2 mb-1" x-text="b"></div></template>
                            <div class="fw-semibold mt-2">Will be encrypted</div>
                            <ul class="mb-1"><template x-for="i in preview?.willEncrypt || []" :key="i.id"><li x-text="i.label + ' (' + bytes(i.bytes) + ')'"></li></template></ul>
                            <div class="fw-semibold" x-show="preview?.willErase?.length">Will be erased (if checked below)</div>
                            <ul class="mb-1"><template x-for="i in preview?.willErase || []" :key="i.id"><li x-text="i.label + ' (' + bytes(i.bytes) + ')'"></li></template></ul>
                            <div class="fw-semibold" x-show="preview?.notCovered?.length">Not covered (stay in plaintext)</div>
                            <ul class="mb-2"><template x-for="i in preview?.notCovered || []" :key="i.id"><li><span x-text="i.label"></span> <span class="text-body-secondary" x-text="'— ' + i.detail"></span></li></template></ul>
                            <p class="mb-2" x-text="'Free space: ' + bytes(preview?.availableFreeBytes) + ' (needs ' + bytes(preview?.requiredFreeBytes) + ').'"></p>
                            <div class="form-check"><input class="form-check-input" type="checkbox" id="enc-snapshot" x-model="enable.snapshotTaken">
                                <label class="form-check-label" for="enc-snapshot">I took a snapshot of the agent's state volume (see the guide)</label></div>
                            <div class="form-check" x-show="!bridge?.recoveryKitExportedAt"><input class="form-check-input" type="checkbox" id="enc-nokit" x-model="enable.acceptNoKit">
                                <label class="form-check-label" for="enc-nokit">I have not downloaded a recovery kit and accept that losing this Windows profile loses every message and memory</label></div>
                            <div class="form-check mb-2" x-show="preview?.willErase?.length"><input class="form-check-input" type="checkbox" id="enc-erase" x-model="enable.erase">
                                <label class="form-check-label" for="enc-erase">Erase the plaintext evaluation copies</label></div>
                            <div class="row g-2">
                                <div class="col-md-6"><input type="password" class="form-control form-control-sm" placeholder="Bridge password" x-model="enable.password" autocomplete="current-password"></div>
                                <div class="col-md-6"><input type="text" class="form-control form-control-sm" placeholder="Type ENCRYPT" x-model="enable.confirm"></div>
                            </div>
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button class="btn btn-outline-secondary btn-sm" @click="showEnableModal = false">Cancel</button>
                            <button class="btn btn-danger btn-sm" :disabled="!canEnable || enabling" @click="confirmEnable()">
                                <span x-show="enabling" class="spinner-border spinner-border-sm me-1"></span>Encrypt and restart the agent
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        </template>

        <!-- ── Global Settings ────────────────────────────────── -->
        <template x-if="$store.router.page === 'settings'">
        <div x-data="globalSettingsPage()" class="container py-3" style="max-width: 760px;">

            <!-- Loading -->
            <div x-show="loading" class="text-center py-5 text-secondary">

                <!-- Tab navigation -->
                <ul class="nav nav-tabs mb-3" role="tablist">
                    <li class="nav-item" role="presentation">
                        <button class="nav-link" :class="activeTab === 'general' ? 'active' : ''"
                                @click="activeTab = 'general'" type="button">General</button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link" :class="activeTab === 'channels' ? 'active' : ''"
                                @click="activeTab = 'channels'" type="button">Channels</button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link" :class="activeTab === 'speech' ? 'active' : ''"
                                @click="activeTab = 'speech'" type="button">Speech</button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link" :class="activeTab === 'memory' ? 'active' : ''"
                                @click="activeTab = 'memory'" type="button">Memory</button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link" :class="activeTab === 'coding' ? 'active' : ''"
                                @click="activeTab = 'coding'; loadCodingFolders()" type="button">Coding</button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link" :class="activeTab === 'mcp' ? 'active' : ''"
                                @click="activeTab = 'mcp'" type="button">MCP Servers</button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link" :class="activeTab === 'connectors' ? 'active' : ''"
                                @click="activeTab = 'connectors'" type="button">Connectors</button>
                    </li>
                </ul>

                <!-- ═══ General tab ═══ -->
                <div x-show="activeTab === 'general'">

                    <!-- LLM Providers -->
                    <div class="mb-4">
                        <h6 class="text-uppercase text-secondary border-bottom pb-2 mb-3">LLM Providers</h6>
                        <template x-for="p in providers" :key="p.name">
                            <div class="provider-card">
                                <div class="provider-card-header">
                                    <span class="provider-name" x-text="p.name"></span>
                                    <button x-show="p.apiKeyConfigured"
                                            class="btn btn-sm btn-outline-secondary ms-auto"
                                            :disabled="isRefreshing(p.name)"
                                            @click="refreshModels(p.name)"
                                            title="Refresh available models from provider API">
                                        <template x-if="isRefreshing(p.name)">
                                            <span><span class="spinner-border spinner-border-sm me-1" role="status"></span>Refreshing...</span>
                                        </template>
                                        <template x-if="!isRefreshing(p.name)">
                                            <span><i class="bi bi-arrow-clockwise"></i> Refresh</span>
                                        </template>
                                    </button>
                                    <span class="provider-api-badge" x-text="p.api"></span>
                                </div>

                                <!-- Endpoint -->
                                <div class="provider-detail" x-show="p.baseUrl">
                                    <span class="label">Endpoint:</span>
                                    <span class="value" x-text="p.baseUrl"></span>
                                </div>

                                <!-- API Key status -->
                                <div class="provider-detail">
                                    <span class="label">API Key:</span>
                                    <span class="key-status" :class="p.apiKeyConfigured ? 'configured' : 'missing'">
                                        <i class="bi" :class="p.apiKeyConfigured ? 'bi-check-circle' : 'bi-x-circle'"></i>
                                        <span x-text="p.apiKeyConfigured
                                            ? (p.apiKeyHint ? 'Configured (' + p.apiKeyHint + ')' : 'Configured')
                                            : (p.apiKeyFrom ? 'From: ' + p.apiKeyFrom : 'Not configured')"></span>
                                    </span>
                                </div>

                                <!-- Model tags -->
                                <div class="provider-models">
                                    <template x-for="m in p.models" :key="m">
                                        <span class="model-tag" x-text="m"></span>
                                    </template>
                                </div>

                                <!-- Model selectors (if 2+ models) -->
                                <template x-if="p.models.length >= 2">
                                    <div>
                                        <div class="provider-detail" style="margin-top: 8px;">
                                            <span class="label">Default Model:</span>
                                            <select class="form-select form-select-sm d-inline-block w-auto"
                                                    :value="defaultModels[p.name]"
                                                    @change="onDefaultModelChange(p.name, $event.target.value)">
                                                <template x-for="m in p.models" :key="m">
                                                    <option :value="m" x-text="m" :selected="m === defaultModels[p.name]"></option>
                                                </template>
                                            </select>
                                        </div>
                                        <div class="provider-detail" style="margin-top: 6px;">
                                            <span class="label">Memory Model:</span>
                                            <select class="form-select form-select-sm d-inline-block w-auto"
                                                    :value="memoryModels[p.name]"
                                                    @change="onMemoryModelChange(p.name, $event.target.value)">
                                                <option value="" :selected="!memoryModels[p.name]">Same as default</option>
                                                <template x-for="m in p.models" :key="m">
                                                    <option :value="m" x-text="m" :selected="m === memoryModels[p.name]"></option>
                                                </template>
                                            </select>
                                        </div>
                                        <div class="hint" style="margin-top: 2px;">Memory model is used for extraction and compaction tasks. A cheaper model can reduce costs.</div>
                                    </div>
                                </template>
                            </div>
                        </template>
                    </div>

                    <!-- Fallback Order -->
                    <div class="mb-4">
                        <h6 class="text-uppercase text-secondary border-bottom pb-2 mb-3">Provider Fallback Order</h6>
                        <p class="text-secondary small mb-2">
                            Drag to reorder. When the primary provider fails, the next provider in the list will be tried.
                        </p>

                            <template x-for="(name, idx) in fallbackOrder" :key="name">
                                <div class="fallback-item" draggable="true"

                                     @dragover="dragOver($event)"

                                    <span class="fallback-grip"><i class="bi bi-grip-vertical"></i></span>
                                    <span class="fallback-rank" x-text="idx + 1"></span>
                                    <span class="fallback-name" x-text="name"></span>
                                    <span class="fallback-model-count"
                                          x-text="(() => { const p = providers.find(pr => pr.name === name); const c = p ? p.models.length : 0; return c + ' model' + (c !== 1 ? 's' : ''); })()"></span>
                                </div>
                            </template>
                        </div>

                    <!-- Sub-agent settings -->

                            <div class="col-3 text-secondary small">0 = default (200)</div>
                        </div>

                            <div class="col-5 text-secondary small">Max concurrent subagents</div>

                        <div class="hint mb-0">
                            Maximum number of sub-agents that may run concurrently.
                        </div>

                    <!-- System info -->
                    <div class="mb-4">
                        <h6 class="text-uppercase text-secondary border-bottom pb-2 mb-3">System</h6>

                            <div class="col-3 text-secondary small">Web UI</div>
                            <div class="col-9 small font-monospace" x-text="webUiInfo"></div>
                        </div>
                        <div class="row mb-1">
                            <div class="col-3 text-secondary small">Agent Hub</div>
                            <div class="col-9 small" :class="agentConnected ? 'text-success' : 'text-muted'"
                                 x-text="agentConnected ? 'Connected' : 'Disconnected'"></div>
                        </div>
                    </div>

                    <!-- Save button -->
                    <div class="d-flex justify-content-between align-items-center">
                        <a href="/setup.html" class="btn btn-sm btn-outline-secondary">Re-run Setup Wizard</a>
                        <button class="btn btn-sm btn-primary" :disabled="!dirty || saving"
                                @click="saveGeneralSettings()">
                            <span x-show="saving" class="spinner-border spinner-border-sm me-1" role="status"></span>
                            <span x-text="saving ? 'Saving...' : 'Save Changes'"></span>
                        </button>
                    </div>
                </div>

                <!-- ═══ Channels tab ═══ -->
                <div x-show="activeTab === 'channels'">
                    <p class="text-secondary small mb-3">
                        Configure messaging channels. Changes require a restart to take effect.
                    </p>

                    <template x-for="ch in channels" :key="ch.type">
                        <div class="channel-card" :class="ch.enabled ? 'enabled' : ''" :data-type="ch.type">
                            <div class="channel-card-header">

                                    <span class="channel-icon"><i class="bi" :class="channelIcon(ch.type)"></i></span>

                                        <template x-if="getPrereqs(ch.type) && !getPrereqs(ch.type).loading">

                                <!-- Dynamic fields from schema -->
                                <template x-for="field in channelSchema(ch.type)" :key="field.key">
                                    <div class="control-group" x-show="isFieldVisible(ch, field)">

                                                <li>Go to <a href="https://discord.com/developers/applications" target="_blank" rel="noopener" style="color:var(--accent);">discord.com/developers/applications</a></li>
