# Opt-in GPU for the embeddings sidecar. The Bridge adds this file with
#   docker compose -f docker-compose.yml -f docker-compose.embeddings-gpu.yml ...
# only when `embeddings: gpu: true` is set in cortex.yml (Recall page: "Run embeddings on the GPU").
# It needs an NVIDIA GPU with Docker GPU support; the base file stays CPU-only so hosts
# without one keep working. Same reservation as the reranker service.
services:
  embeddings:
    environment:
      # Bytes Ollama keeps free per GPU (default 512 MiB) so the lazily loading speech sidecars do not
      # run out of VRAM. When the model does not fit, Ollama splits its layers between CPU and GPU.
      - OLLAMA_GPU_OVERHEAD=${CORTEX_EMBEDDINGS_GPU_OVERHEAD:-536870912}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
